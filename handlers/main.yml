---
# handlers file for pve_config

- name: Pause for 15 seconds
  ansible.builtin.pause:
    seconds: 15

- name: Reboot host
  ansible.builtin.reboot:
    reboot_timeout: 600   # seconds to wait for the host to come back
    msg: "Reboot initiated by Ansible"
    pre_reboot_delay: 5   # seconds before reboot starts
    post_reboot_delay: 15 # seconds after host is up before marking task complete
    connect_timeout: 5    # SSH connection timeout

- name: Restart chrony service
  ansible.builtin.service:
    name: "chronyd"
    state: restarted
  become: true

- name: Reload network
  ansible.builtin.command: ifreload -a

- name: Apply network
  community.proxmox.proxmox_node_network:
    api_host: "{{ ansible_host }}"
    api_user: "{{ ansible_user }}@pam"
    api_password: "{{ ansible_password }}"
    validate_certs: false
    node: "{{ inventory_hostname.split('.')[0] }}"
    state: apply
  delegate_to: localhost
...
