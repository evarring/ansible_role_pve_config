---
# defaults file for pve_config

pve_config_cluster_enabled: false

# Put all no_log to a variable so you can enable logs for troubleshooting when needed
pve_config_nolog: true

# Used when cluster is to be configured
# pve_config_host_group: "tspvecl01"
# pve_config_cluster_name: "{{ pve_config_host_group }}"

###############################################

# node.yml

# https://galaxy.ansible.com/ui/repo/published/community/proxmox/content/module/proxmox_node/

# Manages the license subscription of the node.

# pve_config_subscription:
#   key: # The subscription license key.
#   state: present # Whether the subscription should be present or absent.

# Manages the resolving DNS options of the node.

# pve_config_dns:
#   dns1: "1.1.1.1" # The IP address of the first DNS resolver.
#   dns2: "8.8.8.8" # The IP address of the second DNS resolver.
#   search: "my.domain" # The default search domain. Required.

# Manages the certificates on the node

# pve_config_proxmox_certificates:
#   cert: # The public certificate file (including chain) in PEM format.
#   force: false # Overwrite existing custom or ACME certificate files.
#   key: # The private key file in PEM format.
#   restart: false # Restart pveproxy to rehash the new certificates.
#   state: present # Defines the actions for the certificate.

###############################################

# repos.yml

# By default it will configure Proxmox 9 VE no-subscription repositories

pve_config_repository:
  - name: pve-enterprise
    types: [deb]
    uris: https://enterprise.proxmox.com/debian/pve
    suites: [trixie]
    components: [pve-enterprise]
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    enabled: false
  - name: ceph
    types: [deb]
    uris: https://enterprise.proxmox.com/debian/ceph-squid
    suites: [trixie]
    components: [enterprise]
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    enabled: false
  - name: proxmox
    types: [deb]
    uris: http://download.proxmox.com/debian/pve
    suites: [trixie]
    components: [pve-no-subscription]
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    enabled: true

###############################################

# packages.yml

pve_config_extra_packages:
  - name: ifupdown2
  - name: lvm2
  - name: parted
#   - name: lldpd # If you want more network information from the terminal.
#   - name: multipath-tools # If you plan to use multipathing for SAN.
#   - name: multipath-tools-boot # If you plan to use multipathing for SAN.
#   - name: nvme-cli # If you plan to use NVMe over TCP or FC for example.
#   - name: open-iscsi # If you plan to use iSCSI.

