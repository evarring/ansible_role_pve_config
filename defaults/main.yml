# time.yml

pve_config_time_sync_ntp_pool_servers:
  - "0.no.pool.ntp.org"
  - "1.no.pool.ntp.org"
pve_config_time_sync_conf_path: "/etc/chrony/chrony.conf"
pve_config_time_sync_rtcsync: true
pve_config_time_sync_logs: true
pve_config_time_sync_logdir: /var/log/chrony
pve_config_time_sync_log: tracking measurements statistics

pve_config_time_sync_timezone: "UTC"
# pve_config_time_sync_hwclock: "UTC"

