---
- name: Add manual HA resources
  community.proxmox.proxmox_cluster_ha_resources:
    api_host: "{{ ansible_host }}"
    api_user: "{{ ansible_user }}@pam"
    api_password: "{{ ansible_password }}"
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    hastate: "{{ item.hastate | default('started') }}"
    state: "{{ item.state | default('present') }}"
    validate_certs: false
    group: "{{ item.group | default(omit) }}"
    max_relocate: "{{ item.max_relocate | default(2) }}"
    max_restart: "{{ item.max_restart | default(2) }}"
  delegate_to: localhost
  loop: "{{ pve_config_ha_resources | default([]) }}"

- name: Configure HA rules
  community.proxmox.proxmox_cluster_ha_rules:
    api_host: "{{ ansible_host }}"
    api_user: "{{ ansible_user }}@pam"
    api_password: "{{ ansible_password }}"
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    type: "{{ item.type }}"
    comment: "{{ item.comment }}"
    affinity: "{{ item.affinity }}"
    nodes: "{{ item.nodes | default(omit) }}"
    resources: "{{ item.resources | default(omit) }}"
    disable: "{{ item.disable | default(false) }}"
  delegate_to: localhost
  loop: "{{ pve_config_ha_rules | default([]) }}"

- name: Ensure datacenter.cfg exists
  ansible.builtin.file:
    path: /etc/pve/datacenter.cfg
    state: touch
    owner: root
    group: www-data
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when: >-
    pve_config_crs_config is defined or
    pve_config_ha_config is defined or
    pve_config_migration_network is defined

- name: Set CRS settings
  ansible.builtin.lineinfile:
    path: /etc/pve/datacenter.cfg
    regexp: '^crs:'
    line: "crs: {{ pve_config_crs_config }}"
    create: true
    owner: root
    group: www-data
    mode: "0640"
  when: pve_config_crs_config is defined

- name: Set HA settings
  ansible.builtin.lineinfile:
    path: /etc/pve/datacenter.cfg
    regexp: '^ha:'
    line: "ha: {{ pve_config_ha_config }}"
    create: true
    owner: root
    group: www-data
    mode: "0640"
  when: pve_config_ha_config is defined

- name: Set migration network config
  ansible.builtin.lineinfile:
    path: /etc/pve/datacenter.cfg
    regexp: '^migration:'
    line: "migration: {{ pve_config_migration_network }}"
    create: true
    owner: root
    group: www-data
    mode: "0640"
  when: pve_config_migration_network is defined
...
